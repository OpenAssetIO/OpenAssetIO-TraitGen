# Runs pytest on the matrix of supported platforms any Python versions.
name: Test
on:
  pull_request:

env:
  # Version of OpenAssetIO to test against. Used both for the Python
  # package and for the C++ release builds.
  OPENASSETIO_VERSION: 1.0.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-2022', 'ubuntu-22.04', 'macos-15']
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Pin openassetio to match C++ version, since
      # tests/requirements.txt specifies a range.
      - run: |
          python -m pip install openassetio==${{ env.OPENASSETIO_VERSION }}
          python -m pip install -r tests/requirements.txt
          python -m pip install .
      - name: Test
        run: python -m pytest -v -m "not ctest"

  ctest:
    name: C++ tests ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            release-platform: Linux-X64
            site-packages: lib/python3.11/site-packages
            #  Linting/sanitizers is only exercised on Linux for now.
            preset: lint
          - os: macos-latest
            release-platform: macOS-ARM64
            site-packages: lib/python3.11/site-packages
            preset: test
          - os: windows-2022
            release-platform: Windows-X64
            site-packages: Lib/site-packages
            preset: test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The OpenAssetIO release builds are for CPython 3.11.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Get OpenAssetIO
        # Download the pre-built RelWithDebInfo release archive for this
        # platform, rather than building from source.
        run: |
          gh release download "v$OPENASSETIO_VERSION" \
            --repo OpenAssetIO/OpenAssetIO \
            --pattern "OpenAssetIO-*-${{ matrix.release-platform }}-RelWithDebInfo-*.zip" \
            --dir openassetio-archive
          python -m zipfile -e openassetio-archive/*.zip openassetio-extracted
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install ctest dependencies
        run: >
          python -m pip install
          -r tests/ctest-requirements.txt
          -r tests/requirements.txt
          .

      - name: Test
        run: |
          # Archive contains a single top-level directory, containing
          # the install tree.
          openassetio_dir="$(echo "$PWD"/openassetio-extracted/*)"
          export PYTHONPATH="$openassetio_dir/${{ matrix.site-packages }}"
          export CMAKE_PREFIX_PATH="$openassetio_dir"
          # For Windows.
          export OPENASSETIO_DLL_PATH="$openassetio_dir/bin"
          python -m pytest -v -m ctest
        env:
          OPENASSETIO_TRAITGENTEST_CMAKE_PRESET: ${{ matrix.preset }}
